<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
<title id="title">PhoneOps workflow map</title><desc id="desc">Operator instruction flows through local agent planning into eight phone lanes, browser or Android execution, evidence capture, and an auditable result.</desc>
<defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#14241f"/><stop offset="1" stop-color="#0a0e12"/></linearGradient><linearGradient id="mint" x1="0" x2="1"><stop stop-color="#9ef3c6"/><stop offset="1" stop-color="#91b9ff"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".28"/></filter></defs>
<rect width="1600" height="620" rx="28" fill="url(#bg)"/><text x="70" y="74" fill="#9ef3c6" font-family="monospace" font-size="16" letter-spacing="4">PHONEOPS / LOCAL CONTROL PLANE</text><text x="70" y="125" fill="#edf5f1" font-family="Arial,sans-serif" font-size="42" font-weight="700">One instruction. Eight visible phone lanes.</text><text x="70" y="158" fill="#9aafa6" font-family="monospace" font-size="17">Local planning → parallel execution → evidence → auditable result</text>
<g filter="url(#shadow)" font-family="Arial,sans-serif"><g transform="translate(70 230)"><rect width="250" height="170" rx="18" fill="#172d29" stroke="#9ef3c655"/><text x="28" y="45" fill="#9ef3c6" font-family="monospace" font-size="12" letter-spacing="2">01 / OPERATOR</text><text x="28" y="88" fill="#edf5f1" font-size="25" font-weight="700">Command chat</text><text x="28" y="124" fill="#9aafa6" font-family="monospace" font-size="14">Name a phone or</text><text x="28" y="147" fill="#9aafa6" font-family="monospace" font-size="14">dispatch all lanes.</text></g><g transform="translate(420 230)"><rect width="250" height="170" rx="18" fill="#151c2b" stroke="#91b9ff55"/><text x="28" y="45" fill="#91b9ff" font-family="monospace" font-size="12" letter-spacing="2">02 / PLAN</text><text x="28" y="88" fill="#edf5f1" font-size="25" font-weight="700">Local agent</text><text x="28" y="124" fill="#9aafa6" font-family="monospace" font-size="14">Ollama or approved</text><text x="28" y="147" fill="#9aafa6" font-family="monospace" font-size="14">preset task.</text></g><g transform="translate(770 205)"><rect width="300" height="220" rx="18" fill="#111b20" stroke="#9ef3c655"/><text x="28" y="45" fill="#9ef3c6" font-family="monospace" font-size="12" letter-spacing="2">03 / EXECUTE</text><text x="28" y="88" fill="#edf5f1" font-size="25" font-weight="700">Eight phone lanes</text><g fill="#9ef3c6" opacity=".9"><rect x="30" y="115" width="45" height="62" rx="8"/><rect x="85" y="115" width="45" height="62" rx="8"/><rect x="140" y="115" width="45" height="62" rx="8"/><rect x="195" y="115" width="45" height="62" rx="8"/></g><text x="28" y="203" fill="#9aafa6" font-family="monospace" font-size="14">Browser sessions or AVDs</text></g><g transform="translate(1170 230)"><rect width="300" height="170" rx="18" fill="#282119" stroke="#ffcc7a66"/><text x="28" y="45" fill="#ffcc7a" font-family="monospace" font-size="12" letter-spacing="2">04 / PROVE</text><text x="28" y="88" fill="#edf5f1" font-size="25" font-weight="700">Evidence + result</text><text x="28" y="124" fill="#9aafa6" font-family="monospace" font-size="14">Screenshots, events,</text><text x="28" y="147" fill="#9aafa6" font-family="monospace" font-size="14">status, and logs.</text></g></g>
<g stroke="url(#mint)" stroke-width="4" fill="none" stroke-linecap="round"><path d="M325 315h80"/><path d="M675 315h75"/><path d="M1075 315h85"/></g><g fill="#9ef3c6"><path d="M402 305l18 10-18 10z"/><path d="M742 305l18 10-18 10z"/><path d="M1152 305l18 10-18 10z"/></g><text x="70" y="515" fill="#82919a" font-family="monospace" font-size="14">BOUNDARIES: public HTTPS browsing is isolated per lane · native Android requires a local Google Play AVD · consequential actions stay approved</text><text x="70" y="560" fill="#82919a" font-family="monospace" font-size="13">EDGE | AGENCY · PHONEOPS</text></svg>
